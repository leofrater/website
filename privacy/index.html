  <h1>Privacy notice</h1>
  <p class="lede">If you've had an email from us, this explains who we are, how we found your business details, what we do with them, and how to stop hearing from us. It also covers people who book a call with us.</p>

  <div class="object">
    <h2>Your right to object: how to stop our emails</h2>
    <p>You have the right to object to us using your details for direct marketing, at any time and for free. This right is absolute: if you object, we will stop.</p>
    <p>Just reply <strong>"no"</strong> or <strong>"unsubscribe"</strong> to any of our emails, or email <a href="mailto:leo@foxdmedia.co.uk">leo@foxdmedia.co.uk</a>. We stop straight away and add your address to our do-not-contact list so you are not emailed again.</p>
  </div>

  <h2>Who we are</h2>
  <div class="card">
    <p>Foxd Media is a trading name of <strong>FOXED MEDIA LTD</strong>, a private limited company registered in England and Wales, company number 17455882.</p>
    <p>We are the data controller for the information described here. We are a small business and are not required to appoint a data protection officer. For anything about your data, contact Leo Frater (Director) at <a href="mailto:leo@foxdmedia.co.uk">leo@foxdmedia.co.uk</a>.</p>
    <p>ICO registration number: <span id="ico">registration in progress</span></p>
  </div>

  <h2>Why you've heard from us</h2>
  <p>We help UK service businesses get customers through Meta and Google ads. We email businesses we think could benefit, to offer our services and follow up if you reply.</p>
  <p>We only email limited companies and similar incorporated organisations (such as LLPs), at a business email address. We check each company on the Companies House register first. We do not cold email sole traders, ordinary partnerships, or personal email addresses. We contact each business a small number of times, and stop if there's no interest.</p>

  <h2>What information we hold</h2>
  <ul>
    <li>Your name, and your job title or role (for example, director or owner)</li>
    <li>Your business email address, and sometimes a business phone number</li>
    <li>Company details: company name and number, business address and town, website, and the type of work the business does</li>
    <li>Where we found your details (the source)</li>
    <li>A record of the emails we've sent you, whether they were delivered or opened, and any replies</li>
    <li>If you've asked us to stop: your email address on our do-not-contact list</li>
  </ul>
  <p>We do not collect special category data (such as health information) for outreach.</p>

  <h2>Where we got it</h2>
  <p>From publicly available business sources and business data providers:</p>
  <ul>
    <li>The Companies House public register (company details, directors' names)</li>
    <li>Your business website</li>
    <li>Online business listings, such as Google Maps</li>
    <li>Business contact data providers that find and check work email addresses</li>
  </ul>
  <p>Each email we send tells you which source we used for you. Ask us if you'd like more detail.</p>

  <h2>Why we use it, and our lawful basis</h2>
  <p>We use your details to offer our services to your business, to follow up if you reply, and to keep a do-not-contact list so we never email people who have opted out.</p>
  <p>Our lawful basis is <strong>legitimate interests</strong> (UK GDPR Article 6(1)(f)). Our legitimate interest is promoting our business to other businesses that are likely to find our services relevant. UK law recognises direct marketing as a purpose that can be a legitimate interest. We have weighed this against your interests: we only use business contact details, keep our emails short and infrequent, tell you where we found you, and make it easy to opt out. You can ask us for a copy of our assessment.</p>
  <p>Keeping a do-not-contact list is also in our legitimate interests, and in yours, because it makes sure we respect your objection.</p>

  <h2>If you book a call with us</h2>
  <p>If you book a call through our booking page, you give us your name, email address and answers to a few short questions about your business. We use these to prepare for and hold the call, and to follow up afterwards. Our lawful basis is legitimate interests (and, where you ask us for a proposal, taking steps at your request before entering into a contract). Bookings are handled by Calendly, and calls take place on Google Meet.</p>

  <h2>Who we share it with</h2>
  <p>We never sell your information. We share it only with service providers who help us run our business, acting on our instructions under contract:</p>
  <ul>
    <li>Google Workspace, supplied through InboxKit (our email accounts and domains)</li>
    <li>PlusVibe (our email sending and reply management platform)</li>
    <li>Email verification services, such as MillionVerifier (to check addresses are valid before we email)</li>
    <li>Anthropic (Claude), an AI assistant that helps us organise our lists and draft emails</li>
    <li>Calendly and Google (call bookings and video calls)</li>
  </ul>
  <p>We may also share information if the law requires it, for example with a regulator.</p>

  <h2>International transfers</h2>
  <p>Some of these providers are based in, or store data in, the United States or other countries outside the UK. Where they do, your information is protected either by UK adequacy regulations (including the UK–US "data bridge" for certified US companies) or by the UK's approved data transfer contracts (the International Data Transfer Agreement or Addendum). Contact us if you'd like a copy of the relevant safeguards.</p>

  <h2>How long we keep it</h2>
  <p>Up to 24 months from our last contact with you, then we delete it. If you become a client, we keep your details for as long as we work together and as required by law (for example, accounting records). If you opt out, we keep only your email address on our do-not-contact list, for as long as we do outreach, so that we never contact you again.</p>

  <h2>Automated decisions</h2>
  <p>We do not make any decisions about you based solely on automated processing that have legal or similarly significant effects on you.</p>

  <h2>Your rights</h2>
  <p>As well as your right to object (above), you have the right to:</p>
  <ul>
    <li>ask for a copy of the information we hold about you</li>
    <li>ask us to correct it if it's wrong</li>
    <li>ask us to delete it</li>
    <li>ask us to restrict how we use it</li>
  </ul>
  <p>To use any of these rights, email <a href="mailto:leo@foxdmedia.co.uk">leo@foxdmedia.co.uk</a>. It's free, and we'll reply within one month.</p>

  <h2>How to complain</h2>
  <p>If you're unhappy with how we've handled your information, please tell us first, by emailing <a href="mailto:leo@foxdmedia.co.uk">leo@foxdmedia.co.uk</a> with "Data protection complaint" in the subject. We'll acknowledge your complaint within 30 days, look into it without undue delay, and tell you the outcome.</p>
  <p>You can also complain to the Information Commissioner's Office (ICO), the UK data protection regulator, at any time: <a href="https://ico.org.uk/make-a-complaint/">ico.org.uk/make-a-complaint</a>, or call 0303 123 1113.</p>

  <h2>Keeping your information safe</h2>
  <p>We use reputable, established providers and limit access to your information to the people who need it.</p>
